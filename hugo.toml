baseURL = 'https://yami02.github.io/CTF_HTB/'
languageCode = 'pt-br'
title = 'CTF_HTB // CYBER_OPS'
theme = 'cyberpunk'
paginate = 10

[params]
  description = "Writeups & CTF Hacking Notes"
  author = "Yami02"
  tagline = "hack_the_planet();"
  github = "https://github.com/Yami02"
  htb_profile = "https://www.hackthebox.com"
  neon_color_primary = "#ff2d78"
  neon_color_secondary = "#00ff99"
  showReadingTime = true

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
