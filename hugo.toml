    weight = 2
  [[menu.main]]
    name = "Labs"
    url = "/labs/"
    weight = 3
  [[menu.main]]
    name = "Sherlocks"
    url = "/sherlocks/"
    weight = 4
  [[menu.main]]
    name = "Timeline"
    url = "/timeline/"
    weight = 5
  [[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 6

[taxonomies]
  tag = "tags"
  category = "categories"
  difficulty = "difficulty"

