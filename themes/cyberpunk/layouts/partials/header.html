<header class="site-header">
  <button class="sidebar-toggle" id="sb-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
    <span class="st-bar"></span><span class="st-bar"></span><span class="st-bar"></span>
    <span class="st-glow"></span>
  </button>

  <div class="header-logo-slot">
    <a href="{{ "/" | relURL }}" class="site-logo">
      <span class="logo-main">0xYami02</span>
      <span class="logo-sub">// 0xNihil</span>
    </a>
  </div>

  <!-- breadcrumb -->
  <div class="header-path">
    {{ if .IsHome }}
      <span class="crumb">~</span>
    {{ else }}
      <span>~</span>
      <span class="sep">/</span>
      {{ if .Section }}
      <a href="{{ .CurrentSection.Permalink }}" style="color:var(--dim);text-decoration:none;transition:color .2s" onmouseover="this.style.color='var(--green)'" onmouseout="this.style.color='var(--dim)'">
        {{ .Section }}
      </a>
      {{ end }}
      {{ if not .IsSection }}
      <span class="sep">/</span>
      {{ with .File }}
      <span class="crumb">{{ .BaseFileName }}.md</span>
      {{ else }}
      <span class="crumb">{{ .Title | urlize }}</span>
      {{ end }}
      {{ end }}
    {{ end }}
  </div>

  <div class="header-actions">
    <a href="{{ .Site.Params.github }}" target="_blank" rel="noopener">gh</a>
    <a href="{{ .Site.Params.htb_profile }}" target="_blank" rel="noopener">htb</a>
  </div>
</header>
