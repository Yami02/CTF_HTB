{{ $onCtfs := or (eq .Section "ctfs") (in (slice "challenges" "labs" "sherlocks") .Section) }}
{{ $onProjects := eq .Section "projects" }}
<header class="site-header">
  <a href="{{ .Site.Home.RelPermalink }}" class="site-logo">{{ .Site.Params.author }}</a>

  <nav class="site-nav">
    <a href="{{ "ctfs/" | relURL }}" class="{{ if $onCtfs }}on{{ end }}">/ ctfs</a>
    <a href="{{ "projects/" | relURL }}" class="{{ if $onProjects }}on{{ end }}">/ projects</a>
  </nav>
</header>
