{{ define "main" }}
<div class="content-area err-page">

  <div class="err-ghost" style="--gif:url('{{ "img/nihil.gif" | relURL }}')">
    <img src="{{ "img/nihil.gif" | relURL }}" alt="" aria-hidden="true" decoding="async">
  </div>

  <div class="err-404" data-text="404">404</div>

  <p class="err-cmd">// bash: {{ .RelPermalink }}: No such file or directory</p>
  <p class="err-tip">ele estava aqui. agora n&atilde;o est&aacute; mais.</p>
  <p class="err-cd">redirecionando para ~ em <span id="cd-count">5</span>s_</p>

  <a href="{{ .Site.Home.RelPermalink }}" class="btn btn-s" id="cd-home">[ cd ~ agora ]</a>
</div>

<script>
(function () {
  var home = {{ .Site.Home.RelPermalink | jsonify }};
  var n = 5;
  var el = document.getElementById('cd-count');
  var timer = setInterval(function () {
    n -= 1;
    if (el) el.textContent = n;
    if (n <= 0) {
      clearInterval(timer);
      window.location.href = home;
    }
  }, 1000);
})();
</script>
{{ end }}
