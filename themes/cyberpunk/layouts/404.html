{{ define "main" }}
<div class="content-area" style="text-align:center;padding:5rem 2rem">
  <div style="font-family:var(--head);font-size:clamp(5rem,20vw,10rem);font-weight:900;color:#fff;text-shadow:0 0 30px rgba(0,255,153,.25);line-height:1">
    404
  </div>
  <p style="color:var(--dim);margin:1.25rem 0 .5rem">
    // bash: {{ .RelPermalink }}: No such file or directory
  </p>
  <p style="color:var(--green);font-size:.8rem;margin-bottom:2rem">
    redirecionando para ~ em <span id="cd-count">5</span>s_
  </p>
  <a href="{{ .Site.Home.RelPermalink }}" class="btn btn-s" id="cd-home">[ cd ~ agora ]</a>
</div>

<script>
(function () {
  var home = {{ .Site.Home.RelPermalink | jsonify }};
  var n = 5;
  var el = document.getElementById('cd-count');
  var timer = setInterval(function () {
    n -= 1;
    if (el) el.textContent = n;
    if (n <= 0) {
      clearInterval(timer);
      window.location.href = home;
    }
  }, 1000);
})();
</script>
{{ end }}
